<div hlmSidebarWrapper class="dashboard-wrapper min-h-screen">
  <app-sidebar (navSelected)="selectNav($event)"></app-sidebar>

  <main class="dashboard-main flex-1 min-w-0">
    <app-header></app-header>

    <div class="stats-container">
      <div class="stat-card">
        <div class="stat-content">
          <h2>{{ todayOrders }}</h2>
          <p>Today's Orders</p>
        </div>

        <div class="stat-icon">
          <i class="fa-solid fa-layer-group"></i>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-content">
          <h2>{{ tablesOccupied }}/{{ totalTables }}</h2>
          <p>Tables Occupied</p>
        </div>

        <div class="stat-icon">
          <i class="fa-solid fa-dollar-sign"></i>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-content">
          <h2>{{ tablesAvailable }}</h2>
          <p>Tables Available</p>
        </div>

        <div class="stat-icon">
          <i class="fa-regular fa-rectangle-list"></i>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-content">
          <h2>{{ totalEmployees }}</h2>
          <p>Total Employees</p>
        </div>

        <div class="stat-icon">
          <i class="fa-regular fa-user"></i>
        </div>
      </div>
    </div>
  </main>
</div>
