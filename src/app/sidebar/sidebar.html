<hlm-sidebar class="sego-sidebar" collapsible="icon">
  <div hlmSidebarContent class="sidebar-content">
    <div class="sidebar-header">
      <div class="logo-area">
        <div class="logo-circle">S<span>g</span></div>

        <div class="logo-text">Sego</div>
      </div>
    </div>

    <div hlmSidebarGroup class="sidebar-group">
      <div hlmSidebarGroupContent class="sidebar-menu-container">
        <ul hlmSidebarMenu class="sidebar-menu">
          <li hlmSidebarMenuItem *ngFor="let item of visibleNavItems">
            <button
              type="button"
              class="nav-item"
              [class.active]="activeView === item.id"
              (click)="selectNav(item.id)"
            >
              <div class="nav-left">
                <ng-icon [name]="item.icon" class="nav-icon" />

                <span class="nav-label">
                  {{ item.label }}
                </span>
              </div>

              <ng-icon name="lucideChevronRight" class="nav-arrow" />
            </button>
          </li>
        </ul>
      </div>
    </div>
  </div>
</hlm-sidebar>
