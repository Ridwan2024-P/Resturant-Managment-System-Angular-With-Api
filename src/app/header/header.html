<header class="top-header">
  <div class="header-left">
    <div class="page-title">
      <h2>Dashboard</h2>
      <p>Welcome To {{ userName }}</p>
    </div>
  </div>

  <div class="header-right">
   

   
    <div class="profile-wrap">
      <button
        type="button"
        class="profile"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen"
        aria-haspopup="menu"
      >
        @if (avatarUrl && !imageFailed) {
          <img [src]="avatarUrl" [alt]="userName" (error)="imageFailed = true" />
        } @else {
          <span class="avatar-fallback">{{ initials }}</span>
        }

        <div class="profile-info">
          <h4>{{ userName }}</h4>
          <span>{{ userRole }}</span>
        </div>
      </button>

      @if (menuOpen) {
        <div class="profile-menu" role="menu">
          <button type="button" role="menuitem" (click)="go('/profile')">
            <i class="fa-regular fa-user icon-pink"></i>
            <span>Profile</span>
          </button>
          <button type="button" role="menuitem" (click)="logout()">
            <i class="fa-solid fa-arrow-right-from-bracket icon-pink"></i>
            <span>Logout</span>
          </button>
        </div>
      }
    </div>
  </div>
</header>
